<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ascent Companion</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f4f2ed; }
    #bar {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; font: 12px system-ui, sans-serif; color: #5c6771;
      border-bottom: 1px solid #e4e0d8; background: #faf8f4;
    }
    #bar input {
      flex: 1; font: 12px ui-monospace, monospace; padding: 4px 6px;
      border: 1px solid #d6d1c7; border-radius: 6px;
    }
    #bar button {
      font: 12px system-ui, sans-serif; padding: 4px 8px; border-radius: 6px;
      border: 1px solid #d6d1c7; background: white; cursor: pointer;
    }
    iframe { border: none; width: 100%; height: calc(100% - 33px); }
    @media (prefers-color-scheme: dark) {
      html, body { background: #121619; }
      #bar { background: #1b2024; border-color: #2a3137; color: #9aa4ad; }
      #bar input, #bar button { background: #20262b; border-color: #333c43; color: #eceae4; }
    }
  </style>
</head>
<body>
  <div id="bar">
    <span>App URL:</span>
    <input id="url" type="text" spellcheck="false" />
    <button id="go">Go</button>
  </div>
  <iframe id="frame" title="Ascent Companion"></iframe>
  <script src="panel.js"></script>
</body>
</html>
