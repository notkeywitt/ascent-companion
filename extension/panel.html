<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ascent Companion</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f4f2ed; }
    #bar {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 12px; font: 12px system-ui, sans-serif; color: #5c6771;
      border-bottom: 1px solid #e4e0d8; background: #faf8f4;
    }
    .follow { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    #job { font: 11px ui-monospace, monospace; color: #10606b; white-space: nowrap; margin-left: auto; }
    #job.none { color: #8a939b; }
    iframe { border: none; width: 100%; height: calc(100% - 33px); }
    @media (prefers-color-scheme: dark) {
      html, body { background: #121619; }
      #bar { background: #1b2024; border-color: #2a3137; color: #9aa4ad; }
      #job { color: #3badbc; }
      #job.none { color: #6e7880; }
    }
  </style>
</head>
<body>
  <div id="bar">
    <label class="follow"><input id="follow" type="checkbox" /> Follow JobTread</label>
    <span id="job" class="none">no job open</span>
  </div>
  <iframe id="frame" title="Ascent Companion"></iframe>
  <script src="panel.js"></script>
</body>
</html>
