# Checks a cloud session's branch (claude/**) and any pull request. It does not
# run on main: the lander (lander.yml) verifies the exact commit it pushes
# there, so a second run on main would build the same tree twice.
name: CI

on:
  push:
    branches: ["claude/**"]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run — the mobile build loop
# pushes often, and only the latest commit's result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Unit tests over the pure modules — the write gate, the retry policies,
      # the billing-period rule, and the bill money maths. Blocking: these cover
      # paths that write to the live JobTread org (COMPANION_WRITES_ENABLED is
      # armed in production), so a red suite must not reach main.
      - name: Test
        run: npm test

      # No secrets are set here, exactly like a fresh clone: getPaveConfig()
      # falls back to "" and every JobTread / Apps Script call happens at request
      # time, so none are needed to build. The libSQL client is built lazily
      # (src/db/index.ts), so the build never opens ./data — no setup needed.
      - name: Build
        run: npm run build

      # Blocking. The baseline on 39k never-linted lines turned out to be only two
      # unescaped apostrophes (both fixed), so there is no backlog to grandfather
      # in — keep it clean from here. Warnings (react-hooks/exhaustive-deps) do
      # not fail; errors do.
      #
      # This is the ONLY place lint gates anything: next.config.mjs sets
      # eslint.ignoreDuringBuilds so a style rule can never block a production
      # deploy. Lint blocks the branch, not the ship.
      - name: Lint
        run: npm run lint
