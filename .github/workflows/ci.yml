# The gate CLAUDE.md's build loop describes ("Verify before you commit"), run
# automatically. A branch that fails here must not be merged to main — main is
# production.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run — the mobile build loop
# pushes often, and only the latest commit's result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No secrets are set here, exactly like a fresh clone: getPaveConfig()
      # falls back to "" and every JobTread / Apps Script call happens at request
      # time, so none of those env vars are needed to build.
      #
      # `data/` is the one exception, and it is a real wart rather than a CI
      # quirk: src/db/index.ts calls createClient() at MODULE scope, so
      # `next build`'s page-data collection opens the local libSQL file at
      # IMPORT time. `data/` is gitignored, so a clean clone fails the build with
      # ConnectionFailed — it only passes on a machine that happens to have the
      # directory already. Creating it keeps this step identical to the local
      # gate in CLAUDE.md. The real fix is to make the client lazy; see
      # ARCHITECTURE_REVIEW.md finding 11. Remove this line once that lands.
      - name: Create the local libSQL directory
        run: mkdir -p data

      - name: Build
        run: npm run build

      # Blocking. The baseline on 39k never-linted lines turned out to be only two
      # unescaped apostrophes (both fixed), so there is no backlog to grandfather
      # in — keep it clean from here. Warnings (react-hooks/exhaustive-deps) do
      # not fail; errors do.
      #
      # This is the ONLY place lint gates anything: next.config.mjs sets
      # eslint.ignoreDuringBuilds so a style rule can never block a production
      # deploy. Lint blocks the branch, not the ship.
      - name: Lint
        run: npm run lint
